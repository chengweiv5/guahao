[versions]
kotlin = "2.0.21"
agp = "8.13.2"
coroutines = "1.9.0"
serialization = "1.7.3"
[libraries]
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
junit = { module = "junit:junit", version = "4.13.2" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version = "4.12.0" }
compose-bom = { module = "androidx.compose:compose-bom", version = "2024.09.03" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
androidx-test = { module = "androidx.test:runner", version = "1.6.2" }
androidx-junit = { module = "androidx.test.ext:junit", version = "1.2.1" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
