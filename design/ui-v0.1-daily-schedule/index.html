<h1>先定就诊日期，也能提前指定医生</h1>
<p>选择科室 → 选择日期 → 查询当日排班 → 选择医生。当天医生尚未发布时，从本科室名单预选，标记“目标日排班待确认”。</p>
<p>设计示例：人物、费用、排班均为虚构。页面展开显示全部内容，实际手机中内容滚动、底部操作区固定。</p>
<div class="screens">
<article><h2>1 · 查询前</h2><img src="assets/MIs7X.jpeg" alt="确定科室和日期，查询当日排班后选择医生"></article>
<article><h2>2 · 当天有排班</h2><img src="assets/LUEff.jpeg" alt="按当天出诊信息单选医生，并确认时段"></article>
<article><h2>3 · 当日无号</h2><img src="assets/oRqXX.jpeg" alt="10 月 2 日显示当日无号，可更换日期或预选目标医生"></article>
<article><h2>4 · 尚未放号</h2><img src="assets/GD7jk.jpeg" alt="尚未放号且未返回当天医生，提供预选目标医生按钮"></article>
<article><h2>5 · 已预选，等待目标日排班</h2><img src="assets/AU2Ux.jpeg" alt="林医生已预选，目标日排班待确认，可继续设置放号时间"></article>
